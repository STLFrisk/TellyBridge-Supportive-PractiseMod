org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Single source of truth for the mod version.
# build.gradle's version, the jar filename, mcmod.info and TellyBridgeTrainer.VERSION
# all follow this value; `verifyVersion` fails the build if the Java constant drifts.
# ASCII only on purpose: Gradle reads properties as ISO-8859-1.
modVersion=1.0.0
